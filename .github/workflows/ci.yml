name: Validation

on:
  push:
    branches:
      - main
      - production-readiness-audit-plan
      - 'production-readiness-verified-*'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test-only values for administrator authorization coverage; never production credentials.
      ADMIN_ACCESS_PASSPHRASE: ci-test-only-admin-passphrase
      JWT_SECRET: ci-test-only-cookie-signing-secret
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --json
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
